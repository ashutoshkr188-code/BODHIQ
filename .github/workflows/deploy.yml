name: BODHIQ CI/CD Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push to ECR, and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # ─── Step 1: Checkout Codebase ─────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─── Step 2: Configure AWS Credentials ──────────────────────────────────
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ─── Step 3: Login to Amazon ECR ───────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ─── Step 4: Build, Tag, and Push Docker Images ─────────────────────────
      - name: Build and Push Docker Images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Build and Push Backend
          docker build -t $ECR_REGISTRY/bodhiq-backend:latest ./backend
          docker push $ECR_REGISTRY/bodhiq-backend:latest

          # 2. Build and Push Frontend (injecting build-time environment variables)
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://www.bodhiq.in \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            -t $ECR_REGISTRY/bodhiq-frontend:latest ./frontend
          docker push $ECR_REGISTRY/bodhiq-frontend:latest

          # 3. Build and Push Nginx Proxy
          docker build -t $ECR_REGISTRY/bodhiq-nginx:latest ./nginx
          docker push $ECR_REGISTRY/bodhiq-nginx:latest

      # ─── Step 5: Deploy to AWS EC2 via SSH ──────────────────────────────────
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to project directory
            cd bodhiq || mkdir -p bodhiq && cd bodhiq

            # Pull latest code from repository (optional, compose file is key)
            git pull origin main || true

            # Login to ECR on EC2
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # Pull the newly pushed images
            docker compose -f docker-compose.prod.yml pull

            # Re-create and restart the containers in detached mode
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old/dangling images to conserve disk space
            docker image prune -f
