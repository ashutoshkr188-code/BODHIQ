# ─── BODHIQ docker-compose.prod.yml — AWS EC2 Production ─────────────────────
# Usage (on EC2):
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# Prerequisites:
#   1. .env.production file exists on the EC2 server (see .env.production.example)
#   2. EC2 instance: t3.micro (1 GB RAM) — free tier eligible
#   3. Using SQLite for database (no RDS needed)

version: "3.9"

services:

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: bodhiq_nginx
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    networks:
      - bodhiq_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bodhiq_backend
    env_file:
      - .env.production
    environment:
      # SQLite database (persisted via named volume)
      DATABASE_URL: "sqlite:////data/bodhiq.db"
      UPLOAD_DIR: "/app/uploads"
      # Enable production mode — disables /docs, /redoc, /openapi.json
      ENV: "production"
    volumes:
      # Persist SQLite database across container restarts
      - sqlite_data:/data
      # Persist uploaded media
      - uploads_data:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - bodhiq_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # IMPORTANT: These are baked into the Next.js build — set correctly
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
    container_name: bodhiq_frontend
    env_file:
      - .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - bodhiq_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  sqlite_data:
    driver: local
  uploads_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  bodhiq_net:
    driver: bridge
