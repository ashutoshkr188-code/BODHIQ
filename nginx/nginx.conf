# ─── BODHIQ Nginx Reverse Proxy ───────────────────────────────────────────────
# Handles SSL termination, routing, static file caching, and security headers.
# In production on AWS: SSL is handled by ACM + ALB, so Nginx handles HTTP only.
# In self-managed EC2: Nginx handles Let's Encrypt SSL termination here.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Security: hide version
    server_tokens off;

    # Upstream: Next.js frontend
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    # Upstream: FastAPI backend
    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=notify:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    # ─── Main server block ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Max upload size (matches backend 50MB limit)
        client_max_body_size 55M;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Static uploads from FastAPI ──────────────────────────────────
        location /uploads/ {
            # Proxy to FastAPI which serves from StaticFiles
            proxy_pass http://backend/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Long cache for uploaded media (immutable UUIDs)
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ── FastAPI Backend API ──────────────────────────────────────────
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts (generous for file uploads)
            proxy_connect_timeout 30s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # Disable caching for API responses
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Stricter rate limit for notify endpoint
        location /api/v1/notify {
            limit_req zone=notify burst=2 nodelay;
            proxy_pass http://backend/api/v1/notify;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Stricter rate limit for upload
        location /api/v1/upload {
            limit_req zone=upload burst=3 nodelay;
            client_max_body_size 55M;
            proxy_pass http://backend/api/v1/upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # FastAPI docs (disable in production for security)
        location /docs {
            return 404;
        }
        location /redoc {
            return 404;
        }

        # ── Next.js Frontend ─────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Next.js static assets — long cache
        location /_next/static/ {
            proxy_pass http://frontend/_next/static/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Health check endpoint (used by AWS ALB)
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
